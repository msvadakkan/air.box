# nginx site for the Air_Box device (installed by setup-airbox.sh as
# /etc/nginx/sites-available/airbox).
#
# Two server blocks:
#   1. The app itself, at http://air.box, plus http://airbox.local and any
#      bare IP address (http://10.0.0.1 on the hotspot, or the Pi's address
#      when it's plugged into a wired network).
#   2. A catch-all that answers every other hostname with a redirect to
#      http://air.box/.
#
# The catch-all is the captive portal. On the hotspot, dnsmasq resolves
# every hostname to this Pi (see airbox-captive-dns.conf), so when a phone
# connects and runs its connectivity check (captive.apple.com,
# connectivitycheck.gstatic.com, www.msftconnecttest.com, ...), the check
# gets this redirect instead of the answer it expects. The phone then decides
# it's on a sign-in network and pops up air.box.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 302 http://air.box/;
}

server {
    listen 80;
    listen [::]:80;
    # Connectivity checks always use hostnames, so serving bare IPs here
    # doesn't stop the captive portal from triggering.
    server_name air.box airbox.local localhost ~^\d+\.\d+\.\d+\.\d+$;

    root /var/www/air.box;
    index index.php;

    # Admin uploads allow movies up to 1GB. nginx enforces its own limit
    # before PHP sees the request; keep in sync with php.ini (1030M).
    client_max_body_size 1030M;

    # Media files are served by nginx itself after stream.php / book_stream.php
    # approve the request (X-Accel-Redirect, see stream_file_with_range() in
    # includes/functions.php). "internal" means a browser can't request this
    # path directly, so storage/ stays private.
    location ^~ /_airbox_storage/ {
        internal;
        alias /var/www/air.box/storage/;
    }

    # The JSON "database" (password hashes) and raw uploads are never public.
    location ~ ^/(data|storage)/ {
        return 403;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param AIRBOX_ACCEL_PREFIX /_airbox_storage/;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        # Large uploads over Wi-Fi can take a while to reach PHP.
        fastcgi_read_timeout 600s;
    }
}
