# Air_Box captive portal, DNS half (installed by setup-airbox.sh into
# /etc/NetworkManager/dnsmasq-shared.d/, which NetworkManager's hotspot
# dnsmasq reads).
#
# Answer every DNS lookup from hotspot clients with the Pi's own address.
# air.box resolves to the Pi, and so does every connectivity-check host a
# phone tries (captive.apple.com, connectivitycheck.gstatic.com, ...). nginx
# then redirects those to http://air.box/ (see nginx-airbox.conf), which is
# what makes the phone open air.box as a sign-in page.
#
# Must match the hotspot address in setup-airbox.sh (AP_ADDR).
address=/#/10.0.0.1
