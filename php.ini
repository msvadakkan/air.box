; PHP upload/runtime limits for air.box.
;
; PHP's compiled-in defaults (post_max_size=8M, upload_max_filesize=2M) are
; far below what the app itself allows (movies up to 1GB — see
; MAX_VIDEO_BYTES in includes/config.php). When a request exceeds
; post_max_size, PHP rejects it before any app code runs and emits a
; startup warning, which breaks session_start() with a cascading
; "headers already sent" error — that's what a large upload looks like
; without this file in effect.
;
; Used directly by start.bat and the documented `php -S ... -c php.ini`
; command. For XAMPP/Apache or nginx+PHP-FPM, copy these same values into
; that server's own php.ini (see README) — and for nginx specifically,
; also raise client_max_body_size (see nginx.conf.example), which nginx
; enforces itself before the request ever reaches PHP.

upload_max_filesize = 1030M
post_max_size = 1030M
memory_limit = 256M
max_execution_time = 600
max_input_time = 600
